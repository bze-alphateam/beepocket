packages:
  - packages/core
  - packages/extension
  - packages/connector
onlyBuiltDependencies: []
allowBuilds:
  bufferutil: false
  esbuild: false
  protobufjs: false
  tiny-secp256k1: false
  utf-8-validate: false
overrides:
  minimatch: 11.0.1
  # Dev-only transitive deps of @interchain-kit/core (never shipped); pinned to
  # the releases that fix the OSV advisories the security check reports.
  protobufjs: 7.6.5
  stream-json: 3.7.0
  uuid@8.3.2: 11.1.1
