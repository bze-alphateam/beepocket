name: reproducible

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the zip twice from the same commit and path with the same
  # SOURCE_DATE_EPOCH, wiping every untracked file (node_modules, dist,
  # the zip) between the two builds, and fails if the sums differ.
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Build A
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile
          pnpm build
          mv packages/extension/beepocket.zip "$RUNNER_TEMP/beepocket-a.zip"
      - name: Clean the checkout
        run: |
          git clean -xdff
          git status --short --ignored
      - name: Build B
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile
          pnpm build
      - name: Compare checksums
        run: |
          a="$(sha256sum "$RUNNER_TEMP/beepocket-a.zip" | cut -d' ' -f1)"
          b="$(sha256sum packages/extension/beepocket.zip | cut -d' ' -f1)"
          echo "build A: $a"
          echo "build B: $b"
          {
            echo '### Reproducible build'
            echo
            echo '| build | sha256 |'
            echo '| --- | --- |'
            echo "| A | \`$a\` |"
            echo "| B | \`$b\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$a" != "$b" ]; then
            echo 'the two builds differ' >&2
            exit 1
          fi

  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match packages/extension/package.json version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $TAG matches version $version"

