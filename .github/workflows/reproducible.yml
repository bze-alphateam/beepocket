name: reproducible

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build extension zip
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          pnpm build
          sha256sum packages/extension/beepocket.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zip-${{ matrix.run }}
          path: packages/extension/beepocket.zip
          if-no-files-found: error

  reproducible:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: zip-*
      - name: Compare checksums
        run: |
          a="$(sha256sum zip-a/beepocket.zip | cut -d' ' -f1)"
          b="$(sha256sum zip-b/beepocket.zip | cut -d' ' -f1)"
          echo "a=$a"
          echo "b=$b"
          test "$a" = "$b"

  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match packages/extension/package.json version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $TAG matches version $version"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [reproducible, tag-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zip-a
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp beepocket.zip "beepocket-$TAG.zip"
          sha256sum "beepocket-$TAG.zip" > "beepocket-$TAG.zip.sha256"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "beepocket-$TAG.zip" "beepocket-$TAG.zip.sha256"
