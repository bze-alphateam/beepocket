name: reproducible

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build extension zip
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          pnpm build
          sha256sum packages/extension/beepocket.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zip-${{ matrix.run }}
          path: packages/extension/beepocket.zip
          if-no-files-found: error

  reproducible:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: zip-*
      - name: Compare checksums
        run: |
          a="$(sha256sum zip-a/beepocket.zip | cut -d' ' -f1)"
          b="$(sha256sum zip-b/beepocket.zip | cut -d' ' -f1)"
          echo "a=$a"
          echo "b=$b"
          test "$a" = "$b"

  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match packages/extension/package.json version $version (expected v$version)" >&2
            exit 1
          fi
          echo "tag $TAG matches version $version"

  # Tag pushes only: a draft release with the zip the reproducible job
  # checked, its SHA256SUMS and a provenance attestation. A maintainer
  # reviews the draft and publishes it by hand.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [reproducible, tag-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zip-a
          path: release
      - name: Name the zip and write SHA256SUMS
        id: zip
        env:
          TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          mv beepocket.zip "beepocket-$TAG.zip"
          sha256sum "beepocket-$TAG.zip" > SHA256SUMS
          cat SHA256SUMS
          echo "path=release/beepocket-$TAG.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.zip.outputs.path }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub does not tie drafts to tags uniquely, so a re-run would
          # otherwise add a second draft for the same tag.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')"
          if [ -n "$existing" ]; then
            echo "a release for $TAG already exists (id $existing); delete it first to recreate it" >&2
            exit 1
          fi
          sed "s/{{VERSION}}/$TAG/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "BeePocket $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "release/beepocket-$TAG.zip" release/SHA256SUMS
