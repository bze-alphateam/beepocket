# Only advisories with no upstream fix are listed. Both packages come in through
# @interchain-kit/core, the connector's peer dependency (also a dev dependency
# here). They are not in the extension and not in the connector's published
# dist/, but every dapp that installs @bze/beepocket-connector installs them
# through that peer. BeePocket signs with @noble/curves and never uses elliptic.
# Re-evaluate before the dates below.

[[IgnoredVulns]]
id = "GHSA-848j-6mx2-7j84"
effectiveUntil = 2026-12-31
reason = "elliptic 6.6.1: no upstream fix exists. elliptic can compute a wrong ECDSA nonce for some keys and messages, and a faulty signature can expose the signing key. Not in the extension or the connector's dist/, which ship no elliptic code; dapps that install the connector get it through the @interchain-kit/core peer. BeePocket signs with @noble/curves and never with elliptic."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
effectiveUntil = 2026-12-31
reason = "deepmerge 4.2.2: no upstream fix exists. Merging attacker-controlled objects with it can pollute object prototypes. Not in the extension or the connector's dist/, which ship no deepmerge code; dapps that install the connector get it through the @interchain-kit/core peer."
